# Device e2e on an Android emulator.
# Not on pull_request: slow, flaky, and QA accounts are shared.
#
# Manual: Actions → E2E → Run workflow (optional test_name filter).
# Nightly: 03:00 UTC.

name: E2E

on:
  workflow_dispatch:
    inputs:
      test_name:
        description: 'Name filter, e.g. AUTH-P-03. Empty runs the whole smoke file.'
        required: false
        default: 'AUTH-P-03'
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: e2e-qa-accounts
  cancel-in-progress: false

jobs:
  emulator:
    name: Android emulator e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Require QA secrets
        env:
          QA_A_PASSWORD: ${{ secrets.QA_A_PASSWORD }}
        run: |
          if [ -z "$QA_A_PASSWORD" ]; then
            echo "Set QA_A_EMAIL / QA_A_PASSWORD / QA_B_EMAIL / QA_B_PASSWORD in repo Actions secrets."
            exit 1
          fi

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-x86_64-default

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run e2e
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -euo pipefail
            NAME_FILTER='${{ github.event.inputs.test_name }}'
            if [ '${{ github.event_name }}' = 'schedule' ] || [ -z "$NAME_FILTER" ]; then
              flutter test integration_test/smoke_test.dart -d emulator-5554 \
                --dart-define=QA_A_EMAIL='${{ secrets.QA_A_EMAIL }}' \
                --dart-define=QA_A_PASSWORD='${{ secrets.QA_A_PASSWORD }}' \
                --dart-define=QA_B_EMAIL='${{ secrets.QA_B_EMAIL }}' \
                --dart-define=QA_B_PASSWORD='${{ secrets.QA_B_PASSWORD }}'
            else
              flutter test integration_test/smoke_test.dart -d emulator-5554 \
                --name "$NAME_FILTER" \
                --dart-define=QA_A_EMAIL='${{ secrets.QA_A_EMAIL }}' \
                --dart-define=QA_A_PASSWORD='${{ secrets.QA_A_PASSWORD }}' \
                --dart-define=QA_B_EMAIL='${{ secrets.QA_B_EMAIL }}' \
                --dart-define=QA_B_PASSWORD='${{ secrets.QA_B_PASSWORD }}'
            fi
