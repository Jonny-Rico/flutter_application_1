<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="sb"><span>9:41</span><div class="sb-icons"><span>LTE</span><span>■</span></div></div>
  <div class="appbar"><h1>Shop</h1></div>
  <div class="content">
    <div class="cards">
      <div class="card need"><div class="kicker">Need</div><h2>12</h2><p>Milk, soap, coffee</p></div>
      <div class="card trip"><div class="kicker">This trip</div><h2>—</h2><p>No trip yet</p></div>
    </div>
  </div>
  <div class="scrim"></div>
  <div class="sheet">
    <div class="handle"></div>
    <h3>What do you want to do?</h3>
    <div class="tile">
      <div class="ico t"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></div>
      <div><b>Add to Need</b><span>Stays until someone buys it</span></div>
    </div>
    <div class="tile">
      <div class="ico w"><svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.44C4.52 15.37 5.48 17 7 17h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12L8.1 13h7.45c.75 0 1.41-.41 1.75-1.03L21.7 4H5.21l-.94-2H1zm16 16c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg></div>
      <div><b>Start a trip</b><span>New list for this store run</span></div>
    </div>
  </div>
</body>
</html>
